<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="robots" content="noindex,nofollow">
<title>Queshift V16 Reset</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f4f8ff;color:#0b2447}
.box{text-align:center;padding:32px}.spin{width:52px;height:52px;border:6px solid #dceafd;border-top-color:#075bb8;border-radius:50%;margin:0 auto 18px;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}} small{color:#59708f}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><h2>Loading latest Queshift V16…</h2><small>Clearing old website data once.</small></div>
<script>
(async function(){
  try{
    const remove=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.startsWith("qs_public_cache")) remove.push(k);
    }
    remove.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  try{
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  location.replace("/?v16="+Date.now());
})();
</script>
</body>
</html>
