<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="robots" content="noindex,nofollow">
  <title>Refresh Queshift</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(135deg,#f4f8ff,#eef6ff);
      color:#0b2447;
    }
    .box{
      width:min(92%,520px);
      text-align:center;
      background:#fff;
      border:1px solid #d9e7f7;
      border-radius:20px;
      padding:34px 24px;
      box-shadow:0 18px 50px rgba(7,91,184,.12);
    }
    .spinner{
      width:48px;
      height:48px;
      margin:0 auto 18px;
      border:5px solid #d9e9fb;
      border-top-color:#075bb8;
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:24px;margin:0 0 10px}
    p{margin:0;color:#5d708a;line-height:1.6}
    .small{font-size:12px;margin-top:12px}
  </style>
</head>

<body>
  <main class="box">
    <div class="spinner"></div>
    <h1>Refreshing Queshift...</h1>
    <p>Old website cache clear karke latest website open ki ja rahi hai.</p>
    <p class="small">Please wait a moment.</p>
  </main>

  <script>
  (async function () {
    try { localStorage.clear(); } catch (e) {}
    try { sessionStorage.clear(); } catch (e) {}

    try {
      if ("caches" in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(key => caches.delete(key)));
      }
    } catch (e) {}

    try {
      if ("serviceWorker" in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg => reg.unregister()));
      }
    } catch (e) {}

    try {
      if (indexedDB && indexedDB.databases) {
        const dbs = await indexedDB.databases();
        dbs.forEach(db => {
          if (db && db.name) {
            try { indexedDB.deleteDatabase(db.name); } catch (e) {}
          }
        });
      }
    } catch (e) {}

    const freshUrl =
      "https://queshift.in/index.html?fresh=" +
      Date.now() +
      "&force=latest";

    setTimeout(function () {
      location.replace(freshUrl);
    }, 700);
  })();
  </script>
</body>
</html>
